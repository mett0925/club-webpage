<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전체 동아리 모집 공고 | 동아리픽</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="우리학교 동아리픽 홈">
        <span class="brand-mark">C</span>
        <span>동아리픽</span>
      </a>
      <nav class="top-nav" aria-label="주요 메뉴">
        <a href="index.html#clubs">동아리</a>
        <a href="index.html#process">가입 안내</a>
        <a href="index.html#faq">FAQ</a>
      </nav>
      <div class="header-actions" data-auth-state>
        <a class="header-login" href="login.html" data-auth-login-link>로그인</a>
        <a class="user-chip" href="mypage.html" data-auth-user hidden></a>
        <button class="header-logout" type="button" data-auth-logout hidden>로그아웃</button>
        <a class="header-cta" href="clubs.html">모집 공고</a>
      </div>
    </div>
  </header>

  <main class="recruit-page">
    <section class="recruit-hero">
      <a class="back-link" href="index.html#clubs">← 메인 모집 공고로 돌아가기</a>
      <p class="eyebrow">All Recruit</p>
      <h1>전체 동아리 모집 공고</h1>
      <p class="hero-description">
        모집 대상, 활동 시간, 모집 인원, 마감일을 한 번에 확인하고 관심 있는 동아리에 지원해보세요.
      </p>
    </section>

    <section class="section">
      <div class="recruit-summary">
        <div>
          <strong id="recruitSummaryCount">0</strong>
          <span>상세 공고</span>
        </div>
        <div>
          <strong>8</strong>
          <span>모집 분야</span>
        </div>
      </div>

      <section class="search-panel" aria-label="동아리 모집 공고 검색">
        <div class="search-field">
          <label for="clubSearch">동아리 검색</label>
          <input id="clubSearch" type="search" placeholder="동아리명, 활동 내용, 모집 대상을 검색하세요">
        </div>

        <div class="advanced-search">
          <label>
            분야
            <select id="categoryFilter">
              <option value="all">전체 분야</option>
              <option value="study">학술</option>
              <option value="culture">문화</option>
              <option value="sports">운동</option>
              <option value="volunteer">봉사</option>
              <option value="performance">공연</option>
              <option value="startup">창업</option>
              <option value="media">미디어</option>
              <option value="religion">종교</option>
            </select>
          </label>
          <label>
            활동요일
            <select id="dayFilter">
              <option value="all">전체 요일</option>
              <option value="월">월요일</option>
              <option value="화">화요일</option>
              <option value="수">수요일</option>
              <option value="목">목요일</option>
              <option value="금">금요일</option>
              <option value="토">토요일</option>
              <option value="일">일요일</option>
            </select>
          </label>
          <label>
            마감
            <select id="deadlineFilter">
              <option value="all">전체 마감</option>
              <option value="soon">마감 임박</option>
              <option value="open">여유 있음</option>
            </select>
          </label>
          <button class="secondary-button reset-search-button" type="button" id="resetSearch">검색 초기화</button>
        </div>

        <p class="search-result-text" id="searchResultText">총 0개의 모집 공고가 있습니다.</p>
      </section>

      <div class="recruit-detail-list">
      </div>
      <p class="empty-search-message" id="emptySearchMessage">조건에 맞는 모집 공고가 없습니다. 검색어 또는 상세검색 조건을 바꿔보세요.</p>
    </section>
  </main>

  <footer class="site-footer">
    <strong>동아리픽</strong>
    <span>우리 학교 동아리 정보를 가장 빠르게 확인하세요.</span>
  </footer>
  <script src="../scripts/header-auth.js"></script>
  <script src="../scripts/session-idle.js"></script>
  <script src="../scripts/clubs.js"></script>
</body>
</html>
