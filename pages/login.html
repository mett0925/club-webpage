<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | 동아리픽</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/styles.css">
</head>
<body class="auth-body">
  <main class="auth-page">
    <a class="auth-logo" href="index.html" aria-label="우리학교 동아리픽 홈">
      <span class="brand-mark">C</span>
      <span>동아리픽</span>
    </a>
    <section class="section auth-section">
      <div class="auth-copy">
        <p class="eyebrow">Member Login</p>
        <h1>로그인하고 동아리 가입 신청을 이어가세요.</h1>
        <p>Google 계정 또는 학번으로 로그인할 수 있습니다.</p>
      </div>

      <div class="auth-panel auth-panel-single">
        <form class="auth-form" id="loginForm">
          <h3>로그인</h3>
          <div class="social-login" data-social-login-section hidden>
            <p class="social-login-label">소셜 계정으로 로그인</p>
            <div class="social-login-buttons">
              <button class="social-login-button social-login-button-google" type="button" data-social-login="google" hidden>Google로 계속하기</button>
            </div>
          </div>
          <label>
            학번
            <input type="text" name="studentId" placeholder="20261234" inputmode="numeric" required>
          </label>
          <label>
            비밀번호
            <div class="password-field">
              <input type="password" name="password" placeholder="비밀번호" required>
              <button class="password-toggle" type="button" aria-label="비밀번호 표시" data-password-toggle>👁</button>
            </div>
          </label>
          <button class="primary-button" type="submit">로그인</button>
          <p class="form-message auth-message" id="loginMessage" role="status"></p>
          <div class="auth-switch">
            <span>아직 계정이 없나요?</span>
            <a class="secondary-button" id="signupLink" href="signup.html">회원가입하기</a>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script src="../scripts/login.js"></script>
  <script src="../scripts/social-auth.js"></script>
</body>
</html>
