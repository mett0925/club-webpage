<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>동아리 지원서 작성 | 동아리픽</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="우리학교 동아리픽 홈">
        <span class="brand-mark">C</span>
        <span>동아리픽</span>
      </a>
      <nav class="top-nav" aria-label="주요 메뉴">
        <a href="index.html#clubs">동아리</a>
        <a href="index.html#process">가입 안내</a>
        <a href="index.html#faq">FAQ</a>
      </nav>
      <div class="header-actions" data-auth-state>
        <a class="header-login" href="login.html" data-auth-login-link>로그인</a>
        <a class="user-chip" href="mypage.html" data-auth-user hidden></a>
        <button class="header-logout" type="button" data-auth-logout hidden>로그아웃</button>
        <a class="header-cta" href="clubs.html">모집 공고</a>
      </div>
    </div>
  </header>

  <main class="apply-page">
    <section class="apply-page-hero">
      <a class="back-link" href="clubs.html">← 모집 공고로 돌아가기</a>
      <p class="eyebrow">Club Application</p>
      <h1>동아리 지원서 작성</h1>
      <p class="hero-description">제출한 지원서는 해당 동아리 모집 글 담당자가 마이페이지에서 확인할 수 있습니다.</p>
    </section>

    <section class="application-card" id="applicationContent" hidden>
      <form class="application-form" id="applicationForm">
        <label>
          지원 동아리
          <select name="clubName" id="applicationClubSelect" required>
            <option value="">동아리를 선택하세요</option>
            <option>CodeMate</option>
            <option>Frame</option>
            <option>RunWave</option>
            <option>Warm Hand</option>
            <option>BizLab</option>
            <option>Stage On</option>
            <option>Court Mate</option>
            <option>Green Campus</option>
          </select>
        </label>
        <div class="application-user">
          <strong data-application-user-name>지원자</strong>
          <span data-application-user-meta>로그인 정보를 불러오는 중입니다.</span>
        </div>
        <label>
          연락처
          <input type="tel" name="phone" placeholder="010-0000-0000" required>
        </label>
        <label>
          지원 동기
          <textarea name="motivation" rows="7" placeholder="지원하고 싶은 이유와 활동 가능 시간을 적어주세요." required></textarea>
        </label>
        <button class="primary-button" type="submit">지원서 제출</button>
        <p class="form-message" id="applicationMessage" role="status"></p>
      </form>
    </section>

    <section class="application-card mypage-guard" id="applicationGuard" hidden>
      <h2>로그인이 필요합니다</h2>
      <p>동아리 지원서를 작성하려면 먼저 로그인해주세요.</p>
      <a class="primary-button" id="applicationLoginLink" href="login.html">로그인하러 가기</a>
    </section>
  </main>

  <footer class="site-footer">
    <strong>동아리픽</strong>
    <span>우리 학교 동아리 정보를 가장 빠르게 확인하세요.</span>
  </footer>

  <script src="header-auth.js"></script>
  <script src="apply.js"></script>
</body>
</html>
